<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>가치투자자의 대시보드</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1>가치투자자의 대시보드</h1>
    <nav class="tabs" role="tablist">
      <button id="tab-btn-ratios" class="tab-btn is-active" role="tab" aria-selected="true" aria-controls="panel-ratios" data-panel="ratios">
        밸류에이션 지표
      </button>
      <button id="tab-btn-compare" class="tab-btn" role="tab" aria-selected="false" aria-controls="panel-compare" data-panel="compare">
        수익률 비교
      </button>
    </nav>
  </header>

  <main>
    <!-- 탭 1: 기존 밸류에이션 지표 -->
    <section id="panel-ratios" class="panel is-active" role="tabpanel" aria-labelledby="tab-btn-ratios">
      <form id="ticker-form" class="toolbar">
        <input
          id="ticker-input"
          type="text"
          placeholder="티커/종목명 (예: AAPL, 삼성전자, 005930)"
          autocomplete="off"
          spellcheck="false"
        />
        <button type="submit">조회</button>
      </form>

      <h2 id="company-name" class="company-name" hidden></h2>
      <p id="status" class="status" hidden></p>
      <section id="charts" class="charts-grid" hidden></section>
      <section id="table-section" class="table-section" hidden>
        <h2>원본 데이터</h2>
        <div class="table-wrap">
          <table id="data-table"></table>
        </div>
      </section>
    </section>

    <!-- 탭 2: 종목 간 상대 수익률 비교 -->
    <section id="panel-compare" class="panel" role="tabpanel" aria-labelledby="tab-btn-compare" hidden>
      <form id="compare-form" class="toolbar toolbar-compare">
        <label class="field field-grow">
          <span>종목 (쉼표로 구분, 최대 8개)</span>
          <input
            id="compare-tickers"
            type="text"
            placeholder="예: AAPL, MSFT, 삼성전자, 005930"
            autocomplete="off"
            spellcheck="false"
          />
        </label>
        <label class="field">
          <span>시작일 (기준일)</span>
          <input id="compare-from" type="date" />
        </label>
        <label class="field">
          <span>종료일</span>
          <input id="compare-to" type="date" />
        </label>
        <button type="submit">비교</button>
      </form>

      <div class="quick-ranges" id="quick-ranges">
        <button type="button" data-months="6">6개월</button>
        <button type="button" data-months="12">1년</button>
        <button type="button" data-months="36">3년</button>
        <button type="button" data-months="60">5년</button>
        <button type="button" data-months="120">10년</button>
      </div>

      <p id="compare-status" class="status" hidden></p>

      <section id="compare-result" hidden>
        <div class="chart-card chart-card-wide">
          <h3>기준일 대비 상대 수익률</h3>
          <p class="subtitle" id="compare-basis"></p>
          <div id="compare-chart"></div>
          <div id="compare-legend" class="legend"></div>
        </div>

        <section class="table-section">
          <h2>기간 요약</h2>
          <div class="table-wrap">
            <table id="compare-summary"></table>
          </div>
        </section>
      </section>
    </section>
  </main>

  <script src="{{ url_for('static', filename='main.js') }}"></script>
  <script src="{{ url_for('static', filename='compare.js') }}"></script>
</body>
</html>
